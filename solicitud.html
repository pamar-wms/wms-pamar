<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solicitud de Material — PAMAR</title>
<style>
  :root{
    --ink:#0f1f17; --steel:#1A3D27; --edenor:#25573A; --edenor-lt:#dce8df;
    --accent:#c9a227; --line:#c3ccd4; --panel:#f4f6f8; --white:#fff;
    --gray:#6b7885;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--panel);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

  /* ── HEADER ── */
  .header{background:linear-gradient(135deg,#25573A,#1d4a30);color:#fff;padding:14px 18px}
  .header .app-t{font-size:15px;font-weight:700}
  .header .app-s{font-size:11px;opacity:.85;margin-top:2px}

  /* ── FORM ── */
  .form-wrap{flex:1;padding:14px 16px;max-width:500px;margin:0 auto;width:100%}

  .pf{margin-bottom:11px}
  .pf>label{display:block;font-size:10.5px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
  .pf input,.pf select,.pf textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:#f7f9fb}
  .pf input:focus,.pf select:focus,.pf textarea:focus{outline:none;border-color:var(--edenor);box-shadow:0 0 0 3px rgba(37,87,58,.15)}
  .pf select{appearance:auto;-webkit-appearance:auto}
  .pf textarea{resize:none;height:52px}

  /* ── URGENCIA ── */
  .urgency{display:flex;gap:6px}
  .urgency label{flex:1;text-align:center;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:11.5px;cursor:pointer;background:#fff;font-weight:600;color:var(--gray);transition:all .2s}
  .urgency input{display:none}
  .urgency label.sel{border-color:var(--edenor);background:var(--edenor-lt);color:var(--edenor)}

  /* ── MATERIALES CARGA RÁPIDA ── */
  .mat-grid{display:grid;grid-template-columns:110px 1fr 80px;gap:6px;align-items:end;margin-bottom:8px}
  .mat-grid label{font-size:10px;color:var(--gray);display:block;margin-bottom:2px}
  .mat-grid input{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px;font-size:13px;font-family:inherit}
  .mat-grid input:focus{outline:none;border-color:var(--edenor)}
  .mat-grid input[readonly]{background:#f0f2f4;color:var(--ink)}
  .mat-grid input.mat-err{color:#c53727}

  .mat-items-list{margin-top:4px}
  .mat-items-list .mat-header{font-size:10px;color:var(--gray);font-weight:700;margin-bottom:4px}
  .mat-row{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#f7f9fb;border-radius:4px;margin-bottom:3px;font-size:12px}
  .mat-row code{font-weight:700;min-width:70px}
  .mat-row .mat-desc{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mat-row .mat-cant{min-width:50px;text-align:right;font-weight:700}
  .mat-row .mat-del{background:#fde7e5;color:#c53727;border:none;border-radius:4px;width:24px;height:24px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}

  .mat-hint{color:var(--gray);font-size:11px;text-align:center;padding:10px}

  /* ── ENVIAR ── */
  .phone-send{background:var(--edenor);color:#fff;border:none;border-radius:10px;width:100%;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
  .phone-send:hover{background:#1d4a30}
  .phone-send:active{transform:scale(.98)}
  .phone-send:disabled{opacity:.5;pointer-events:none}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;color:#fff;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
  .toast.ok{background:var(--edenor)}
  .toast.err{background:#c53727}
  .toast.show{opacity:1}

  /* ── SUCCESS ── */
  .success-screen{display:none;text-align:center;padding:60px 20px}
  .success-screen .check{font-size:64px;margin-bottom:16px}
  .success-screen h2{color:var(--edenor);font-size:22px;margin-bottom:8px}
  .success-screen p{color:var(--gray);font-size:14px;margin-bottom:24px}
  .success-screen button{padding:14px 32px;background:var(--edenor);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}

  /* ── LOADING ── */
  .loading{text-align:center;padding:40px 20px;color:var(--gray);font-size:14px}
  .loading .spin{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--edenor);border-radius:50%;animation:sp .6s linear infinite;margin-bottom:8px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ── PROGRESS BAR ── */
  .mis-pedidos{margin-top:18px;padding:14px 0;border-top:2px solid var(--edenor-lt)}
  .mis-pedidos h3{font-size:14px;color:var(--steel);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .mis-pedidos .mp-empty{font-size:12px;color:var(--gray);text-align:center;padding:16px}
  .mp-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .mp-card .mp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .mp-card .mp-code{font-weight:700;font-size:13px;color:var(--steel)}
  .mp-card .mp-date{font-size:11px;color:var(--gray)}
  .mp-card .mp-detail{font-size:11.5px;color:var(--ink);margin-bottom:8px;line-height:1.4}
  .mp-card .mp-detail span{color:var(--gray)}
  .mp-card .mp-estado{font-size:11px;font-weight:700;margin-bottom:6px}
  .mp-card .mp-estado.est-ok{color:#2e7d32}
  .mp-card .mp-estado.est-warn{color:#e65100}
  .mp-card .mp-estado.est-err{color:#c53727}
  .mp-card .mp-estado.est-done{color:var(--edenor)}
  .prog-bar{display:flex;align-items:center;gap:0;margin-bottom:4px;position:relative}
  .prog-step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}
  .prog-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;transition:all .3s}
  .prog-dot.active{border-color:var(--edenor);background:var(--edenor);color:#fff}
  .prog-dot.done{border-color:var(--edenor);background:var(--edenor-lt);color:var(--edenor)}
  .prog-dot.rejected{border-color:#c53727;background:#fde7e5;color:#c53727}
  .prog-label{font-size:8.5px;color:var(--gray);margin-top:3px;text-align:center;line-height:1.2;max-width:60px;word-wrap:break-word}
  .prog-label.active{color:var(--edenor);font-weight:700}
  .prog-line{position:absolute;top:9px;left:0;right:0;height:2px;background:var(--line);z-index:0}
  .prog-line-fill{position:absolute;top:9px;left:0;height:2px;background:var(--edenor);z-index:0;transition:width .3s}

  /* ── DIME MIDE ── */
  .dime-check{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .dime-check input[type=checkbox]{width:18px;height:18px;accent-color:var(--edenor)}
  .dime-check label{font-weight:600;cursor:pointer;font-size:13px}

  /* ── SEARCHABLE SELECT ── */
  .search-select{position:relative}
  .search-select input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:#f7f9fb}
  .search-select input:focus{outline:none;border-color:var(--edenor);box-shadow:0 0 0 3px rgba(37,87,58,.15)}
  .ss-list{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--edenor);border-top:none;border-radius:0 0 8px 8px;max-height:180px;overflow-y:auto;z-index:20;display:none;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .ss-list.open{display:block}
  .ss-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f0f0}
  .ss-item:active,.ss-item:hover{background:var(--edenor-lt)}
  .ss-item b{color:var(--edenor)}
  .ss-empty{padding:10px 12px;font-size:12px;color:var(--gray);text-align:center}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="app-t">🏗️ Solicitar Material</div>
  <div class="app-s" id="headerUser">PAMAR</div>
</div>

<!-- LOADING -->
<div class="loading" id="loadingScreen">
  <div class="spin"></div>
  <div>Cargando datos…</div>
</div>

<!-- FORM -->
<div class="form-wrap" id="formWrap" style="display:none">

  <div class="pf">
    <label>Área</label>
    <select id="ns-area" onchange="nsAreaChanged()">
      <option value="Obra y Distribución">Obra y Distribución</option>
      <option value="Mantenimiento">Mantenimiento</option>
      <option value="Dime Mide">Dime Mide</option>
    </select>
  </div>

  <div class="pf" id="ns-obra-wrap">
    <label>Obra</label>
    <div class="search-select">
      <input type="text" id="ns-obra" placeholder="Escribí número o nombre de obra…" autocomplete="off" oninput="ssFilter('ns-obra','ns-obra-list',OBRAS)" onfocus="ssFilter('ns-obra','ns-obra-list',OBRAS)">
      <div class="ss-list" id="ns-obra-list"></div>
    </div>
  </div>

  <div id="ns-dime-fields" style="display:none">
    <div class="pf">
      <label id="ns-sol-label">Cuadrilla</label>
      <div class="search-select">
        <input type="text" id="ns-solicitante" placeholder="Escribí apellido o nombre…" autocomplete="off" oninput="ssFilter('ns-solicitante','ns-sol-list',_solCuads)" onfocus="ssFilter('ns-solicitante','ns-sol-list',_solCuads)">
        <div class="ss-list" id="ns-sol-list"></div>
      </div>
    </div>
    <div class="pf">
      <label id="ns-usr-label">Usuario Edenor a asignar</label>
      <div class="search-select">
        <input type="text" id="ns-usredenor" placeholder="Escribí usuario…" autocomplete="off" oninput="ssFilter('ns-usredenor','ns-usr-list',_solUsrs)" onfocus="ssFilter('ns-usredenor','ns-usr-list',_solUsrs)">
        <div class="ss-list" id="ns-usr-list"></div>
      </div>
    </div>
  </div>

  <div class="pf" id="ns-cuad-wrap">
    <label>Cuadrilla</label>
    <div class="search-select">
      <input type="text" id="ns-cuad" placeholder="Escribí nombre o número…" autocomplete="off" oninput="ssFilter('ns-cuad','ns-cuad-list',CUADRILLAS)" onfocus="ssFilter('ns-cuad','ns-cuad-list',CUADRILLAS)">
      <div class="ss-list" id="ns-cuad-list"></div>
    </div>
  </div>

  <div class="pf">
    <label>Supervisor (para quién se pide)</label>
    <div class="search-select">
      <input type="text" id="ns-sup" placeholder="Escribí nombre del supervisor…" autocomplete="off" oninput="ssFilter('ns-sup','ns-sup-list',SUPERVISORES)" onfocus="ssFilter('ns-sup','ns-sup-list',SUPERVISORES)">
      <div class="ss-list" id="ns-sup-list"></div>
    </div>
  </div>

  <div class="pf">
    <label>Urgencia</label>
    <div class="urgency" id="ns-urg">
      <label onclick="selUrg(this,'Baja')">Baja</label>
      <label class="sel" onclick="selUrg(this,'Normal')">Normal</label>
      <label onclick="selUrg(this,'Urgente')">Urgente</label>
    </div>
  </div>

  <div class="pf">
    <label>📦 Materiales — carga rápida</label>
    <div class="mat-grid">
      <div>
        <label>Matrícula</label>
        <input id="ns-mat-inp" placeholder="Matrícula" oninput="nsMatAuto()" onkeydown="if(event.key==='Enter'){event.preventDefault();nsMatEnter()}">
      </div>
      <div>
        <label>Descripción</label>
        <input id="ns-desc-inp" readonly placeholder="—">
      </div>
      <div>
        <label>Cantidad</label>
        <input type="number" id="ns-cant-inp" placeholder="Cant." inputmode="numeric" onkeydown="if(event.key==='Enter'){event.preventDefault();nsCantEnter()}">
      </div>
    </div>
    <button type="button" onclick="nsCantEnter()" style="width:100%;padding:10px;margin:6px 0 8px;background:#2e7d32;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">➕ Agregar material</button>
    <div id="ns-items">
      <div class="mat-hint">Completá matrícula y cantidad, luego tocá "Agregar material"</div>
    </div>
  </div>

  <div class="pf">
    <label>Observaciones</label>
    <textarea id="ns-obs" placeholder="Aclaraciones para el pañolero…"></textarea>
  </div>

  <button class="phone-send" id="btnSend" onclick="sendSolicitud()">📤 Enviar solicitud al depósito</button>

  <div class="mis-pedidos" id="misPedidos">
    <h3>📋 Mis pedidos</h3>
    <div id="misPedidosList"></div>
  </div>
</div>

<!-- SUCCESS -->
<div class="success-screen" id="successScreen">
  <div class="check">✅</div>
  <h2>¡Solicitud enviada!</h2>
  <p>Tu pedido llegó al depósito. Te avisamos cuando esté listo.</p>
  <p id="successCode" style="font-size:18px;font-weight:700;color:var(--steel);margin-bottom:20px"></p>
  <button onclick="nuevaSol()">📦 Hacer otro pedido</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbws6NWSXWTblDQ-vFy0YJs6eURETO66H_Wf1DGQv8zW-HB2ANyKmjChrWDCo2PLGHPknQ/exec';

// ── MASTER DATA ──
let OBRAS = [];       // ["id · nombre", ...]
let CUADRILLAS = ['Juan Carlos GUTIERREZ','Damian Joan DADIN','Juan Pablo CASAZOLA','Javier Carlos ROLON','Leandro Matias GALEANO','Sergio Gustavo ROMERO','Elias Maximiliano Jesus NORES','Federico Miguel SERRANO','Lucas Hector CALDENTEY','Ivan Emanuel ROMANO','Lucas Hernan GOMEZ','Gonzalo Matias DADI','Rosana Sabrina INSAURRALDE','Brenda Estefania ALFONSO','Nahuel Daniel SOTOMAYOR','Pablo Leonardo OJEDA','Agustin ARRIETA','Leandro Angel ORELLANA','Maximiliano Ezequiel GOMEZ','Cesar Nelson NUÑEZ','Juan Jose OBREGON','Sebastian Manuel BOHOS','Gustavo Ezequiel GIMENEZ','Alberto Ezequiel MIRANDA','Angel Tomas DE NICOLA PIKEL','Marina Soledad PESCE','Daniel Alberto VELIZ','Gustavo Ezequiel REPISARDA','Santiago Jesus CHAVEZ','Nicolas Maximiliano FERNANDEZ','Julio LOPEZ','Ignacio Gabriel GUTIERREZ','Arnaldo Nicola CONTRERAS','Dylan Leandro ORREGO','Santiague ARISTIDE','Maximo MARTIN','Mauro GEREZ','Elias Alejandro NUÑEZ','Bautista OBREGON','Juan GODOY','Joaquin Gabriel HOYOS','Pablo VILLANUEVA','Aldo SANCHEZ','Juan Ignacio VILLAREAL','Diego CASTRO','Claudio LEIVA','Ariel GOMEZ','Diego VIDELA','Gonzalo VELIZ','Lautaro MARTINEZ','Alexis GIMENEZ','Federico LEIVA','Alexis MEDINA','Santiago CANTOS','Leandro OSWALD','Diego SANCHEZ','Federico SILVA','Elias RODRIGUEZ','Nelson SILVA','Cristian MACIEL','Pablo GONZALEZ','Matias Ezequiel CANTOS','Misael Mauro LOPEZ','Ian Agustin PEREIRA','Maximo Federico ROJAS FERREYRA','Fernando Gabriel TULA','Lucas Ezequiel BONILLA','Leandro Isaias AVENDAÑO','Pablo Daniel AMARILLA','Jorge Martin REINOSO','Facundo Nicolas BOIKO'];
let MATERIALES = [];  // [{matricula, descripcion, unidad?}, ...]
let SUPERVISORES = []; // ["nombre", ...]
let DIME_CUADRILLAS = ['GUTIERREZ Juan Carlos','DADIN Damian Joan','CASAZOLA Juan Pablo','ROLON Javier Carlos','GALEANO Leandro Matias','ROMERO Sergio Gustavo','NORES Elias Maximiliano Jesus','SERRANO Federico Miguel','CALDENTEY Lucas Hector','ROMANO Ivan Emanuel','GOMEZ Lucas Hernan','DADI Gonzalo Matias','INSAURRALDE Rosana Sabrina','ALFONSO Brenda Estefania','SOTOMAYOR Nahuel Daniel','OJEDA Pablo Leonardo','ARRIETA Agustin','ORELLANA Leandro Angel','GOMEZ Maximiliano Ezequiel','NUÑEZ Cesar Nelson','OBREGON Juan Jose','BOHOS Sebastian Manuel','GIMENEZ Gustavo Ezequiel','MIRANDA Alberto Ezequiel','DE NICOLA PIKEL Angel Tomas','PESCE Marina Soledad','VELIZ Daniel Alberto','REPISARDA Gustavo Ezequiel','CHAVEZ Santiago Jesus','FERNANDEZ Nicolas Maximiliano','LOPEZ Julio','GUTIERREZ Ignacio Gabriel','CONTRERAS Arnaldo Nicola','ORREGO Dylan Leandro','ARISTIDE Santiague','MARTIN Maximo','GEREZ Mauro','NUÑEZ Elias Alejandro','OBREGON Bautista','GODOY Juan','HOYOS Joaquin Gabriel','VILLANUEVA Pablo','SANCHEZ Aldo','VILLAREAL Juan Ignacio','CASTRO Diego','LEIVA Claudio','GOMEZ Ariel','VIDELA Diego','VELIZ Gonzalo','MARTINEZ Lautaro','GIMENEZ Alexis','LEIVA Federico','MEDINA Alexis','CANTOS Santiago','OSWALD Leandro','SANCHEZ Diego','SILVA Federico','RODRIGUEZ Elias','SILVA Nelson','MACIEL Cristian','GONZALEZ Pablo','CANTOS Matias Ezequiel','LOPEZ Misael Mauro','PEREIRA Ian Agustin','ROJAS FERREYRA Maximo Federico','TULA Fernando Gabriel','BONILLA Lucas Ezequiel','AVENDAÑO Leandro Isaias','AMARILLA Pablo Daniel','REINOSO Jorge Martin','BOIKO Facundo Nicolas'];
let MANT_CUADRILLAS = ['GUTIERREZ Juan Carlos','DADIN Damian Joan','CASAZOLA Juan Pablo','ROLON Javier Carlos','GALEANO Leandro Matias','ROMERO Sergio Gustavo','NORES Elias Maximiliano Jesus','SERRANO Federico Miguel','CALDENTEY Lucas Hector','ROMANO Ivan Emanuel','GOMEZ Lucas Hernan','DADI Gonzalo Matias','INSAURRALDE Rosana Sabrina','ALFONSO Brenda Estefania','SOTOMAYOR Nahuel Daniel','OJEDA Pablo Leonardo','ARRIETA Agustin','ORELLANA Leandro Angel','GOMEZ Maximiliano Ezequiel','NUÑEZ Cesar Nelson','OBREGON Juan Jose','BOHOS Sebastian Manuel','GIMENEZ Gustavo Ezequiel','MIRANDA Alberto Ezequiel','DE NICOLA PIKEL Angel Tomas','PESCE Marina Soledad','VELIZ Daniel Alberto','REPISARDA Gustavo Ezequiel','CHAVEZ Santiago Jesus','FERNANDEZ Nicolas Maximiliano','LOPEZ Julio','GUTIERREZ Ignacio Gabriel','CONTRERAS Arnaldo Nicola','ORREGO Dylan Leandro','ARISTIDE Santiague','MARTIN Maximo','GEREZ Mauro','NUÑEZ Elias Alejandro','OBREGON Bautista','GODOY Juan','HOYOS Joaquin Gabriel','VILLANUEVA Pablo','SANCHEZ Aldo','VILLAREAL Juan Ignacio','CASTRO Diego','LEIVA Claudio','GOMEZ Ariel','VIDELA Diego','VELIZ Gonzalo','MARTINEZ Lautaro','GIMENEZ Alexis','LEIVA Federico','MEDINA Alexis','CANTOS Santiago','OSWALD Leandro','SANCHEZ Diego','SILVA Federico','RODRIGUEZ Elias','SILVA Nelson','MACIEL Cristian','GONZALEZ Pablo','CANTOS Matias Ezequiel','LOPEZ Misael Mauro','PEREIRA Ian Agustin','ROJAS FERREYRA Maximo Federico','TULA Fernando Gabriel','BONILLA Lucas Ezequiel','AVENDAÑO Leandro Isaias','AMARILLA Pablo Daniel','REINOSO Jorge Martin','BOIKO Facundo Nicolas'];
let USR_EDENOR = ['ddadin','jugutierrez','maolivera','lmgaleano','fserrano','eromano','jcasazola','segromero','megomez','sbohos','balfonso','alemiranda','rinsaurralde','gugimenez','grepisarda','pojeda','nimfernandez','sachavez','julilopez','iggutierrez','laumartinez','mpesce','juobregon','enores'];

// ── STATE ──
let nsItems = [];
let selectedUrg = 'Normal';
let _solCuads = [];
let _solUsrs = [];

// ── INIT ──
document.addEventListener('DOMContentLoaded', async () => {
  await loadMaestros();
  renderNsItemsList();
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('formWrap').style.display = 'block';
  nsObraChanged();
  loadMisPedidos();
});

async function loadMaestros(){
  try {
    const resp = await fetch(SCRIPT_URL);
    const data = await resp.json();
    if(data.obras) OBRAS = data.obras;
    // Cuadrillas: solo sobreescribir si el Sheet trae MÁS que las hardcodeadas
    if(data.cuadrillas && data.cuadrillas.length >= CUADRILLAS.length) CUADRILLAS = data.cuadrillas;
    if(data.materiales) MATERIALES = data.materiales;
    if(data.supervisores) SUPERVISORES = data.supervisores;
    if(data.dimeCuadrillas && data.dimeCuadrillas.length >= DIME_CUADRILLAS.length) DIME_CUADRILLAS = data.dimeCuadrillas;
    if(data.mantCuadrillas && data.mantCuadrillas.length >= MANT_CUADRILLAS.length) MANT_CUADRILLAS = data.mantCuadrillas;
    if(data.usuariosEdenor && data.usuariosEdenor.length > 0) USR_EDENOR = data.usuariosEdenor;
    // Cache para offline
    localStorage.setItem('sol_maestros', JSON.stringify({
      obras:OBRAS, cuadrillas:CUADRILLAS, materiales:MATERIALES,
      supervisores:SUPERVISORES, dimeCuadrillas:DIME_CUADRILLAS, mantCuadrillas:MANT_CUADRILLAS,
      usuariosEdenor:USR_EDENOR
    }));
  } catch(e){
    try {
      const cached = JSON.parse(localStorage.getItem('sol_maestros')||'{}');
      if(cached.obras) OBRAS = cached.obras;
      // Solo usar cache si tiene al menos la misma cantidad que las hardcodeadas
      if(cached.cuadrillas && cached.cuadrillas.length >= 71) CUADRILLAS = cached.cuadrillas;
      if(cached.materiales) MATERIALES = cached.materiales;
      if(cached.supervisores) SUPERVISORES = cached.supervisores || [];
      if(cached.dimeCuadrillas && cached.dimeCuadrillas.length >= 71) DIME_CUADRILLAS = cached.dimeCuadrillas;
      if(cached.mantCuadrillas && cached.mantCuadrillas.length >= 71) MANT_CUADRILLAS = cached.mantCuadrillas;
      if(cached.usuariosEdenor && cached.usuariosEdenor.length > 0) USR_EDENOR = cached.usuariosEdenor;
    } catch(ce){}
  }
  // Fallback: si SUPERVISORES sigue vacío, leer del WMS localStorage
  if(!SUPERVISORES.length){
    try {
      const wms = JSON.parse(localStorage.getItem('wms_supervisores')||'[]');
      if(Array.isArray(wms) && wms.length){
        SUPERVISORES = wms.map(s => {
          if(typeof s === 'string') return s;
          // Si es objeto {nombre, apellido}, armar nombre completo
          return [s.apellido, s.nombre].filter(Boolean).join(' ').trim();
        }).filter(Boolean);
      }
    } catch(e){}
  }
}

// ── SEARCHABLE SELECT (buscar mientras escribís) ──
function ssFilter(inputId, listId, dataArr){
  const inp = document.getElementById(inputId);
  const list = document.getElementById(listId);
  const q = inp.value.trim().toLowerCase();

  // Mostrar todos si el campo está vacío y tiene foco
  const items = q.length < 1 ? dataArr.slice(0, 15) : dataArr.filter(x => x.toLowerCase().includes(q)).slice(0, 10);

  if(!items.length){
    list.innerHTML = '<div class="ss-empty">No se encontró</div>';
  } else {
    list.innerHTML = items.map(item => {
      let display = esc(item);
      if(q.length >= 1){
        const idx = item.toLowerCase().indexOf(q);
        if(idx >= 0){
          display = esc(item.substring(0,idx)) + '<b>' + esc(item.substring(idx, idx+q.length)) + '</b>' + esc(item.substring(idx+q.length));
        }
      }
      return `<div class="ss-item" data-val="${esc(item)}">${display}</div>`;
    }).join('');
  }
  list.classList.add('open');

  list.querySelectorAll('.ss-item').forEach(el => {
    el.addEventListener('click', function(){
      inp.value = this.dataset.val;
      list.classList.remove('open');
      if(inputId === 'ns-obra') nsObraChanged();
      if(inputId === 'ns-obra'||inputId === 'ns-cuad'||inputId === 'ns-solicitante') setTimeout(loadMisPedidos,50);
    });
  });
}

// Cerrar listas al hacer click afuera
document.addEventListener('click', function(e){

    if(!list.parentElement.contains(e.target)) list.classList.remove('open');

// ── ÁREA CHANGED (auto-detect Dime Mide / Mantenimiento) ──
function nsAreaChanged(){
  const areaSel = document.getElementById('ns-area');
  const area = areaSel ? areaSel.value : '';
  const isDime = area === 'Dime Mide';
  const isMant = area === 'Mantenimiento';
  const isSpecial = isDime || isMant;
  const df = document.getElementById('ns-dime-fields');
  const cw = document.getElementById('ns-cuad-wrap');
  const ow = document.getElementById('ns-obra-wrap');
  if(df) df.style.display = isSpecial ? 'block' : 'none';
  if(cw) cw.style.display = isSpecial ? 'none' : 'block';
  if(ow) ow.style.display = isDime ? 'none' : 'block';
  const solLabel = document.getElementById('ns-sol-label');
  const usrLabel = document.getElementById('ns-usr-label');
  if(solLabel) solLabel.textContent = 'Cuadrilla';
  if(usrLabel) usrLabel.textContent = 'Usuario Edenor a asignar';
  if(isSpecial){
    const srcList = isDime ? DIME_CUADRILLAS : CUADRILLAS;
    _solCuads = (srcList||[]).slice();
    _solUsrs = (USR_EDENOR||[]).slice();
    document.getElementById('ns-solicitante').value = '';
    document.getElementById('ns-usredenor').value = '';
  }
  loadMisPedidos();
}

// ── URGENCIA ──
function selUrg(el, val){
  selectedUrg = val;
  el.parentElement.querySelectorAll('label').forEach(l => l.classList.remove('sel'));
  el.classList.add('sel');
}

// ── MATERIALES CARGA RÁPIDA ──
function matLookup(mat){
  const m = MATERIALES.find(r => r.matricula === mat);
  return m ? m.descripcion : null;
}

function nsMatAuto(){
  const v = document.getElementById('ns-mat-inp').value.trim();
  const desc = matLookup(v);
  const di = document.getElementById('ns-desc-inp');
  di.value = desc || '';
  di.style.color = desc ? 'var(--ink)' : '#c53727';
}

function nsMatEnter(){
  const mi = document.getElementById('ns-mat-inp');
  if(!mi.value.trim()) return;
  const desc = matLookup(mi.value.trim());
  if(!desc){ toast('Matrícula no encontrada','err'); mi.select(); return; }
  document.getElementById('ns-cant-inp').focus();
}

function nsCantEnter(){
  const mi = document.getElementById('ns-mat-inp');
  const ci = document.getElementById('ns-cant-inp');
  const mat = mi.value.trim(), cant = parseInt(ci.value) || 0;
  if(!mat || cant <= 0){ toast('Matrícula y cantidad requeridas','err'); return; }
  const desc = matLookup(mat);
  if(!desc){ toast('Matrícula no encontrada','err'); mi.select(); return; }
  const m = MATERIALES.find(x => x.matricula === mat);
  nsItems.push({matricula:mat, descripcion:desc, cantidad:cant, unidad:m&&m.unidad==='Metro'?'m':'u'});
  mi.value = ''; ci.value = '';
  document.getElementById('ns-desc-inp').value = '';
  renderNsItemsList();
  toast('✓ Agregado: ' + mat + ' ×' + cant);
  // Foco de vuelta a matrícula para seguir cargando
  setTimeout(function(){ mi.focus(); mi.click(); }, 100);
}

function renderNsItemsList(){
  const c = document.getElementById('ns-items');
  if(!c) return;
  if(!nsItems.length){
    c.innerHTML = '<div class="mat-hint">Escribí matrícula + Enter, cantidad + Enter para agregar</div>';
    return;
  }
  c.innerHTML = '<div class="mat-items-list"><div class="mat-header">MATERIALES CARGADOS ('+nsItems.length+')</div>'
    + nsItems.map((it,i) => `<div class="mat-row">
      <code>${it.matricula}</code>
      <span class="mat-desc">${it.descripcion}</span>
      <b class="mat-cant">${it.cantidad} ${it.unidad}</b>
      <button class="mat-del" onclick="nsItems.splice(${i},1);renderNsItemsList()">✕</button>
    </div>`).join('') + '</div>';
}

// ── ENVIAR ──
async function sendSolicitud(){
  const areaSel = document.getElementById('ns-area');
  const areaSolicitud = areaSel ? areaSel.value : '';
  const esDime = areaSolicitud === 'Dime Mide';
  const isMant = areaSolicitud === 'Mantenimiento';
  const isSpecial = esDime || isMant;
  const obraText = esDime ? '' : document.getElementById('ns-obra').value.trim();
  if(!esDime && !obraText){ toast('Seleccioná una obra','err'); return; }

  const items = nsItems.filter(it => it.matricula && it.cantidad > 0);
  if(!items.length){ toast('Agregá al menos un material','err'); return; }
  const cuadText = isSpecial ? '' : document.getElementById('ns-cuad').value;
  const supText = document.getElementById('ns-sup').value;

  const btn = document.getElementById('btnSend');
  btn.disabled = true;
  btn.textContent = '⏳ Enviando…';

  const solicitud = {
    obra: obraText,
    areaSolicitud: areaSolicitud,
    cuadrilla: cuadText,
    supervisor: supText,
    urgencia: selectedUrg,
    materiales: JSON.stringify(items),
    observaciones: document.getElementById('ns-obs').value,
    fecha: new Date().toLocaleString('es-AR'),
    estado: 'Pendiente',
    esDime: !!esDime
  };

  if(isSpecial){
    const solSel = document.getElementById('ns-solicitante');
    const usrEdn = document.getElementById('ns-usredenor');
    if(esDime && solSel && solSel.value) solicitud.solicitanteDime = solSel.value;
    if(isMant && solSel && solSel.value) solicitud.cuadrilla = solSel.value;
    if(usrEdn && usrEdn.value.trim()) solicitud.usuarioEdenor = usrEdn.value.trim();
  }

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST', mode: 'no-cors',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(solicitud)
    });
    showSuccess();
  } catch(e){
    try {
      const pending = JSON.parse(localStorage.getItem('sol_pending') || '[]');
      pending.push(solicitud);
      localStorage.setItem('sol_pending', JSON.stringify(pending));
      toast('Sin conexión — guardado. Se enviará cuando haya señal.','ok');
    } catch(le){
      toast('Error al enviar. Intentá de nuevo.','err');
    }
    btn.disabled = false;
    btn.textContent = '📤 Enviar solicitud al depósito';
  }
}

function showSuccess(){
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('successScreen').style.display = 'block';
  document.getElementById('successCode').textContent = 'Código: SOL-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + String(Math.floor(Math.random()*900)+100);
}

function nuevaSol(){
  nsItems = [];
  selectedUrg = 'Normal';
  document.getElementById('formWrap').style.display = 'block';
  document.getElementById('successScreen').style.display = 'none';
  document.getElementById('ns-obra').value = '';
  document.getElementById('ns-cuad').value = '';
  document.getElementById('ns-sup').value = '';
  document.getElementById('ns-obs').value = '';
  document.getElementById('ns-mat-inp').value = '';
  document.getElementById('ns-desc-inp').value = '';
  document.getElementById('ns-cant-inp').value = '';
  document.getElementById('ns-area').value = 'Obra y Distribución';
  nsAreaChanged();
  document.querySelectorAll('.urgency label').forEach(l => l.classList.remove('sel'));
  document.querySelectorAll('.urgency label')[1].classList.add('sel');
  renderNsItemsList();
  document.getElementById('btnSend').disabled = false;
  document.getElementById('btnSend').textContent = '📤 Enviar solicitud al depósito';
}

// ── UTILS ──
function toast(msg, type='ok'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3000);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── MIS PEDIDOS (progress bar) ──
// Cache de solicitudes desde Google Sheets
let _misSolCache=null;
let _misSolCacheTime=0;

async function fetchMisSolicitudes(){
  // Cache por 30 segundos para no hacer fetch en cada filtro
  if(_misSolCache && (Date.now()-_misSolCacheTime)<30000) return _misSolCache;
  try{
    const resp=await fetch(SCRIPT_URL+'?action=mis_solicitudes');
    const data=await resp.json();
    _misSolCache=data.solicitudes||[];
    _misSolCacheTime=Date.now();
    return _misSolCache;
  }catch(e){
    console.log('Error fetching solicitudes:',e);
    // Fallback a localStorage
    try{return JSON.parse(localStorage.getItem('wms_solicitudes')||'[]')}catch(e2){return[]}
  }
}

async function loadMisPedidos(){
  const area=document.getElementById('ns-area').value;
  const isDime=area==='Dime Mide';
  const isMant=area==='Mantenimiento';
  const isSpecial=isDime||isMant;
  // Get filter value
  let filterVal='';
  if(isSpecial){
    filterVal=(document.getElementById('ns-solicitante').value||'').trim().toLowerCase();
  } else {
    const obraInp=document.getElementById('ns-obra').value||'';
    const cuadInp=document.getElementById('ns-cuad').value||'';
    filterVal=(obraInp+'|||'+cuadInp).toLowerCase();
  }
  const wrap=document.getElementById('misPedidos');
  const list=document.getElementById('misPedidosList');
  if(!filterVal||filterVal==='|||'){list.innerHTML='<div class="mp-empty">Seleccioná una obra o cuadrilla para ver tus pedidos anteriores</div>';return}
  // Fetch solicitudes from Google Sheets (con fallback a localStorage)
  list.innerHTML='<div class="mp-empty">⏳ Cargando pedidos…</div>';
  wrap.style.display='block';
  let sols=await fetchMisSolicitudes();
  // Filter
  let filtered=[];
  if(isSpecial){
    filtered=sols.filter(s=>{
      const solArea=(s.areaSolicitud||'').toLowerCase();
      if(isDime&&solArea!=='dime mide')return false;
      if(isMant&&solArea!=='mantenimiento')return false;
      const cuad=(s.solicitanteDime||s.cuadrilla||'').toLowerCase();
      return cuad&&filterVal&&cuad.includes(filterVal);
    });
  } else {
    const [obraF,cuadF]=filterVal.split('|||');
    filtered=sols.filter(s=>{
      const solArea=(s.areaSolicitud||'').toLowerCase();
      if(solArea==='dime mide'||solArea==='mantenimiento')return false;
      const obraMatch=!obraF||(s.obra||'').toLowerCase().includes(obraF);
      const cuadMatch=!cuadF||(s.cuadrilla||'').toLowerCase().includes(cuadF);
      return obraMatch&&(cuadMatch||!cuadF);
    });
  }
  // Sort by date desc
  filtered.sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  // Limit to last 10
  filtered=filtered.slice(0,10);
  if(!filtered.length){
    wrap.style.display='block';
    list.innerHTML='<div class="mp-empty">No hay pedidos anteriores con estos datos</div>';
    return;
  }
  wrap.style.display='block';
  list.innerHTML=filtered.map(s=>renderPedidoCard(s,isDime||isMant)).join('');
}

function renderPedidoCard(s,needsApproval){
  const estado=s.estado||'Pendiente';
  const rechazada=estado==='Rechazada';
  // Define steps
  const steps=needsApproval||s.esDime||s.esMant
    ?['Pend. aprobación','Pendiente','En preparación','Listo','Entregado']
    :['Pendiente','En preparación','Listo','Entregado'];
  // Current step index
  let curIdx=steps.indexOf(estado);
  if(curIdx<0)curIdx=rechazada?0:-1;
  // Items summary
  const items=s.items||[];
  const itemsText=items.length
    ? items.slice(0,3).map(it=>it.matricula+' ×'+it.cantidad).join(', ')+(items.length>3?' (+'+( items.length-3)+' más)':'')
    : '';
  // Estado class
  let estCls='est-warn';
  if(estado==='Entregado')estCls='est-done';
  else if(rechazada)estCls='est-err';
  else if(estado==='Listo')estCls='est-ok';
  // Date
  const fecha=s.fecha?(s.fecha+'').slice(0,10):'';
  // Progress bar
  const pctFill=steps.length>1?Math.max(0,curIdx)/(steps.length-1)*100:0;
  const bar=`<div style="position:relative;margin:0 9px">
    <div class="prog-line"></div>
    <div class="prog-line-fill" style="width:${rechazada?0:pctFill}%"></div>
    <div class="prog-bar">
      ${steps.map((st,i)=>{
        let dotCls='';
        if(rechazada&&i===0)dotCls='rejected';
        else if(i<curIdx)dotCls='done';
        else if(i===curIdx)dotCls='active';
        const icon=rechazada&&i===0?'✕':dotCls==='done'?'✓':dotCls==='active'?'●':'';
        const lblCls=i===curIdx?' active':'';
        return `<div class="prog-step"><div class="prog-dot ${dotCls}">${icon}</div><div class="prog-label${lblCls}">${st}</div></div>`;
      }).join('')}
    </div>
  </div>`;
  return `<div class="mp-card">
    <div class="mp-head"><span class="mp-code">${esc(s.codigo||'—')}</span><span class="mp-date">${fecha}</span></div>
    <div class="mp-detail">${itemsText?esc(itemsText):'<span>Sin detalle</span>'}${s.obra?' · <span>'+esc(s.obra)+'</span>':''}</div>
    <div class="mp-estado ${estCls}">${rechazada?'❌ Rechazada — '+(s.motivoRechazo||'sin motivo'):estado==='Entregado'?'✅ Entregado':estado}</div>
    ${bar}
    ${rechazada&&s.motivoRechazo?'<div style="font-size:11px;color:#c53727;margin-top:4px">Motivo: '+esc(s.motivoRechazo)+'</div>':''}
  </div>`;
}

// Retry pending when back online
window.addEventListener('online', async () => {
  const pending = JSON.parse(localStorage.getItem('sol_pending') || '[]');
  if(!pending.length) return;
  for(const sol of pending){
    try {
      await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(sol)});
    } catch(e){ return; }
  }
  localStorage.removeItem('sol_pending');
  toast('Solicitudes pendientes enviadas ✓');
});
